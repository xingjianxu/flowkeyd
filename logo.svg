<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bgGrad)"/>

  <!-- 主体：两个叠加的按键方块 -->
  <!-- 后方的空心按键 -->
  <rect x="46" y="56" width="96" height="96" rx="20" fill="none" stroke="url(#flowGrad)" stroke-width="12"/>
  <!-- 前方的实心按键 -->
  <rect x="114" y="104" width="96" height="96" rx="20" fill="url(#flowGrad)"/>
  <!-- 连接流线 -->
  <path d="M 94 152 L 114 152" stroke="url(#flowGrad)" stroke-width="12" stroke-linecap="round"/>
</svg>